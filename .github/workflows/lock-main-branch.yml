name: Lock main branch protection
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
  administration: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const actor = context.actor;
            const { data: perm } = await github.request('GET /repos/{owner}/{repo}/collaborators/{username}/permission', {
              owner,
              repo,
              username: actor,
            });
            if (perm.permission !== 'admin') {
              core.setFailed(`Refusing to apply branch protection: ${actor} is not a repo admin.`);
              return;
            }
            const branch = 'main';
            await github.request('PUT /repos/{owner}/{repo}/branches/{branch}/protection', {
              owner,
              repo,
              branch,
              required_status_checks: null,
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: false,
                require_code_owner_reviews: false,
                required_approving_review_count: 1,
                require_last_push_approval: false,
              },
              restrictions: null,
              required_linear_history: false,
              allow_force_pushes: { enabled: false },
              allow_deletions: { enabled: false },
            });
            core.info('Branch protection applied to main.');
