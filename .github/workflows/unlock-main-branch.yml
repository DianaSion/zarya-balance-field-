name: Unlock main branch protection
on:
  workflow_dispatch:
permissions:
  administration: write

jobs:
  unprotect:
    runs-on: ubuntu-latest
    steps:
      - name: Remove branch protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const actor = context.actor;
            const { data: perm } = await github.request('GET /repos/{owner}/{repo}/collaborators/{username}/permission', {
              owner,
              repo,
              username: actor,
            });
            if (perm.permission !== 'admin') {
              core.setFailed(`Refusing to remove branch protection: ${actor} is not a repo admin.`);
              return;
            }
            const branch = 'main';
            await github.request('DELETE /repos/{owner}/{repo}/branches/{branch}/protection', {
              owner,
              repo,
              branch,
            });
            core.info('Branch protection removed from main.');
